spring:
  application:
    name: customers
  config:
    import: "optional:classpath:.env"
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_CUSTOMERS}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  output:
    ansi:
      enabled: ALWAYS
  messages:
    basename: messages
    encoding: UTF-8
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
  cloud:
    openfeign:
      client:
        config:
          brasilapi:
            connect-timeout: 5000
            read-timeout: 5000

server:
  port: ${SERVER_PORT}

market-sphere:
  feign:
    clients:
      brasilapi:
        base-url: ${BRASIL_API_URL}
